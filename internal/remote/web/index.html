<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>pitwall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08090c">
<style>
:root {
  --bg: #08090c; --surface: #14161b; --field: #1c1f26; --line: #252932;
  --fg: #f2f3f5; --muted: #8e939c; --primary: #2997ff; --on-primary: #06121f;
  --red: #ff6b6b; --yellow: #ffc533; --green: #59d499; --purple: #bd93ff;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --field: #ebebef; --line: #dcdce0;
    --fg: #1d1d1f; --muted: #6e6e73; --primary: #0066cc; --on-primary: #ffffff;
    --red: #cf222e; --yellow: #9a6700; --green: #1a7f37; --purple: #8250df;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
}
main { max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
h1 { font-size: 20px; font-weight: 600; margin: 0; }
#status { color: var(--muted); font-size: 13px; text-align: right; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pill { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--field); }
.pill.pending-approval, .pill.awaiting-input { color: var(--yellow); }
.pill.error { color: var(--red); }
.pill.completed { color: var(--green); }
.pill.plan-ready { color: var(--purple); }
.tab { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where { color: var(--muted); font-size: 13px; margin-top: 2px; }
.detail { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 13px; }
.risk { color: var(--red); font-weight: 600; }
.advice { color: var(--muted); }
.row { display: flex; gap: 8px; margin-top: 12px; }
button {
  font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--field); color: var(--fg); flex: 1;
}
button.allow { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
button.send { flex: none; }
button:disabled { opacity: 0.5; }
textarea, input {
  font: inherit; width: 100%; min-height: 44px; max-height: 40vh; resize: vertical; padding: 10px 12px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--field); color: var(--fg);
}
input { min-height: 44px; }
textarea:focus, input:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.note { margin-top: 10px; font-size: 13px; color: var(--muted); }
.note.bad { color: var(--red); }
.empty { color: var(--muted); text-align: center; padding: 48px 16px; }
.empty .row { max-width: 360px; margin: 16px auto 0; }
#push .note { margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card.focus { border-color: var(--primary); }
code { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; background: var(--field); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<main>
  <header><h1>pitwall</h1><div id="status" aria-live="polite"></div></header>
  <div id="push"></div>
  <div id="list"></div>
</main>
<script src="app.js"></script>
</body>
</html>
