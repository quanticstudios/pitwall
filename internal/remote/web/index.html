<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>pitwall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08090c">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <section id="home" class="view">
    <header class="bar"><h1>pitwall</h1><span id="device" class="status"></span></header>
    <div class="offline" hidden>Offline, reconnecting</div>
    <div class="scroll pad"><div class="wrap">
      <div id="push"></div>
      <div id="full" hidden><button class="btn">Open the full client</button></div>
      <div id="list"></div>
    </div></div>
  </section>
  <section id="chat" class="view" hidden>
    <header class="bar">
      <button id="back" class="icon" aria-label="Back to tabs">‹</button>
      <div class="head"><span id="ctitle" class="title"></span><span id="cmeta" class="meta"></span></div>
      <button id="pick" class="pick" hidden aria-haspopup="dialog">Model</button>
    </header>
    <div class="offline" hidden>Offline, reconnecting</div>
    <div class="stage">
      <div id="log" class="scroll pad"><div class="wrap">
        <div id="more" class="more"></div>
        <div id="entries" class="entries"></div>
        <div id="pend" class="entries"></div>
        <div id="work" class="workrow" hidden><i class="dot"></i><span></span></div>
      </div></div>
      <button id="newpill" class="newpill" hidden>New messages</button>
    </div>
    <footer class="compose"><div class="wrap">
      <div id="asks"></div>
      <div id="attachment" hidden></div>
      <button id="attach" class="btn" type="button" hidden>Attach picture</button>
      <input id="photo" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
      <form id="composer" class="composer">
        <textarea id="text" class="field" rows="1" enterkeyhint="send" aria-label="Message"></textarea>
        <button id="send" class="btn primary" type="submit">Send</button>
      </form>
      <p id="cnote" class="note" hidden></p>
    </div></footer>
  </section>
</div>
<div id="sheet" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mhead">
    <h2 id="mhead">Model</h2><div id="models" class="choices"></div>
    <h2>Effort</h2><div id="efforts" class="choices"></div>
    <p id="mnote" class="note"></p>
    <div class="inline"><button id="mclose" class="btn">Done</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
