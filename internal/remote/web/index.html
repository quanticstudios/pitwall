<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>pitwall</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#08090c">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <section id="home" class="view">
    <header class="bar"><h1>pitwall</h1><span id="device" class="status"></span><button id="newbtn" class="icon" aria-label="New tab" hidden>+</button></header>
    <div class="offline" hidden>Offline, reconnecting</div>
    <div class="scroll pad"><div class="wrap">
      <div id="push"></div>
      <div id="full" hidden><button class="btn">Open the full client</button></div>
      <p id="lnote" class="note" hidden></p>
      <div id="list"></div>
    </div></div>
  </section>
  <section id="chat" class="view" hidden>
    <header class="bar">
      <button id="back" class="icon" aria-label="Back to tabs">‹</button>
      <div class="head"><span id="ctitle" class="title"></span><div class="metarow"><span id="cmeta" class="meta"></span><button id="pick" class="pick" hidden aria-haspopup="dialog">Model</button></div></div>
      <button id="scrbtn" class="icon glyph" aria-label="Screen" title="Screen" hidden>&gt;_</button>
      <button id="tmenu" class="icon" aria-label="Tab actions" aria-haspopup="dialog" hidden>⋯</button>
    </header>
    <div class="offline" hidden>Offline, reconnecting</div>
    <div class="stage">
      <div id="log" class="scroll pad"><div class="wrap">
        <div id="more" class="more"></div>
        <div id="entries" class="entries"></div>
        <div id="pend" class="entries"></div>
        <div id="work" class="workrow" hidden><i class="dot"></i><span></span></div>
      </div></div>
      <button id="newpill" class="newpill" hidden>New messages</button>
    </div>
    <footer class="compose"><div class="wrap">
      <div id="asks"></div>
      <div id="away"></div>
      <div id="hold"></div>
      <div id="queue"></div>
      <div id="attachment" hidden></div>
      <button id="attach" class="btn" type="button" hidden>Attach picture</button>
      <input id="photo" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
      <div id="slash" class="slash" role="listbox" aria-label="Commands" hidden></div>
      <form id="composer" class="composer">
        <textarea id="text" class="field" rows="1" enterkeyhint="send" aria-label="Message"></textarea>
        <button id="stop" class="btn" type="button" hidden>Stop</button>
        <button id="send" class="btn primary" type="submit">Send</button>
      </form>
      <p id="cnote" class="note cnote" hidden></p>
    </div></footer>
  </section>
  <section id="screen" class="view" hidden>
    <header class="bar">
      <button id="sback" class="icon" aria-label="Back to the chat">‹</button>
      <div class="head"><span id="stitle" class="title"></span><span class="meta">Screen, as the terminal shows it now</span></div>
    </header>
    <div class="offline" hidden>Offline, reconnecting</div>
    <div id="sbox" class="scroll pad"><pre id="stext" class="out screen">Reading the screen</pre></div>
    <footer class="compose"><div class="wrap">
      <p id="snote" class="note bad" hidden></p>
      <div id="keys" class="keys"></div>
    </div></footer>
  </section>
  <section id="newtab" class="view" hidden>
    <header class="bar"><button id="nback" class="icon" aria-label="Back to tabs">‹</button><h1>New tab</h1></header>
    <div class="scroll pad"><div class="wrap">
      <p id="nload" class="note">Loading…</p>
      <form id="nform" class="form" hidden>
        <label id="nsessionl">Session<select id="nsession" class="field"></select></label>
        <label>Folder<select id="nfolder" class="field"></select></label>
        <input id="npath" class="field" placeholder="/home/you/project or ~/project" aria-label="Folder path" autocapitalize="off" autocomplete="off" hidden>
        <label>Agent<select id="nagent" class="field"></select></label>
        <label id="nworktreel">Worktree<select id="nworktree" class="field"><option value="">None</option><option value="new">New worktree</option></select></label>
        <input id="nbranch" class="field" placeholder="Branch name" aria-label="Branch name" autocapitalize="off" autocomplete="off" hidden>
        <label id="nbriefl">First message (optional)<textarea id="nbrief" class="field" rows="3" placeholder="What should the agent do?"></textarea></label>
        <p id="nnote" class="note bad" hidden></p>
        <button id="nstart" class="btn primary" type="submit">Start</button>
      </form>
    </div></div>
  </section>
</div>
<div id="tsheet" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Tab actions">
    <div id="tacts" class="acts"></div>
    <p id="tnote" class="note" hidden></p>
    <div class="inline"><button id="tclose" class="btn">Cancel</button></div>
  </div>
</div>
<div id="sheet" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mhead">
    <h2 id="mhead">Model</h2><div id="models" class="choices"></div>
    <h2>Effort</h2><div id="efforts" class="choices"></div>
    <p id="mnote" class="note"></p>
    <div class="inline"><button id="mclose" class="btn">Done</button></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
