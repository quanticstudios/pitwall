name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # why: the build the maintainer runs and tests; Gio draws through OpenGL.
  GOFLAGS: -tags=novulkan

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Gio's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: go vet for Windows
        run: GOOS=windows go vet ./...
      - run: go test -race -timeout 5m ./...
      - name: Check the vendored terminal module
        run: |
          go -C third_party/x-vt vet ./...
          go -C third_party/x-vt test -race -timeout 5m ./...
      - name: Scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/get.sh
          sh scripts/get_test.sh
          sh scripts/release_test.sh

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # why: HEAD is the PR merged into its base, so HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Require a CHANGELOG.md entry for cmd/ and internal/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- cmd internal; then
            echo 'No change under cmd/ or internal/.'
            exit 0
          fi
          # why: read live, so adding the label and re-running the job skips it.
          label=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "no-changelog")') || label=false
          if [ "$label" = true ]; then
            echo 'Skipped: the PR has the no-changelog label.'
            exit 0
          fi
          git show HEAD^1:CHANGELOG.md | awk '/^## /{n++} n==1' > base.md
          awk '/^## /{n++} n==1' CHANGELOG.md > head.md
          added=$(grep -vxFf base.md head.md | grep -v '^## ' | grep '[^[:space:]]' || true)
          if [ -n "$added" ]; then
            printf 'New in the top CHANGELOG.md section:\n%s\n' "$added"
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR changes cmd/ or internal/ but adds no line under the top '## Unreleased' section of CHANGELOG.md. Add one, or ask a maintainer for the no-changelog label and re-run this job."
          exit 1

  other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # why: a hung Windows test can hold a file in the build cache, failing the cache save.
          cache: ${{ runner.os != 'Windows' }}
      - run: go build ./...
      - run: go vet ./...
      - name: Test the platform-independent packages
        run: go test ./internal/agent ./internal/pane ./internal/model ./internal/layout ./internal/input
      # why: these suites have never run on this OS; drop continue-on-error after the first green run.
      - name: Test everything
        continue-on-error: true
        # why: cmd/pitwall's tests hang on Windows and leave a daemon running that locks files (#3).
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go list ./... | grep -v '/cmd/pitwall$' | xargs go test -timeout 3m
          else
            go test -timeout 3m ./...
          fi
      - name: Stop leftover test processes
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*.test' -or $_.ProcessName -like 'pitwall*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      - name: get.sh
        if: runner.os == 'macOS'
        run: sh scripts/get_test.sh
      - name: get.ps1
        if: runner.os == 'Windows'
        # why: the runner's Windows PowerShell 5.1 crashed loading its own assembly.
        shell: pwsh
        run: |
          $env:PITWALL_GET_TEST = '1'
          . ./scripts/get.ps1
          if ((Get-PitwallAsset AMD64) -ne 'pitwall_windows_amd64.zip' -or (Get-PitwallAsset ARM64) -ne 'pitwall_windows_arm64.zip') { exit 1 }
