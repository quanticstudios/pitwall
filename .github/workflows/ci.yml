name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # why: the build the maintainer runs and tests; Gio draws through OpenGL.
  GOFLAGS: -tags=novulkan

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Gio's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: go vet for Windows
        run: GOOS=windows go vet ./...
      - run: go test -race -timeout 5m ./...
      - name: Check the vendored terminal module
        run: |
          go -C third_party/x-vt vet ./...
          go -C third_party/x-vt test -race -timeout 5m ./...
      - name: Install scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/get.sh
          sh scripts/get_test.sh

  other:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # why: a hung Windows test can hold a file in the build cache, failing the cache save.
          cache: ${{ runner.os != 'Windows' }}
      - run: go build ./...
      - run: go vet ./...
      - name: Test the platform-independent packages
        run: go test ./internal/agent ./internal/pane ./internal/model ./internal/layout ./internal/input
      # why: these suites have never run on this OS; drop continue-on-error after the first green run.
      - name: Test everything
        continue-on-error: true
        # why: cmd/pitwall's tests hang on Windows and leave a daemon running that locks files (#3).
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go list ./... | grep -v '/cmd/pitwall$' | xargs go test -timeout 3m
          else
            go test -timeout 3m ./...
          fi
      - name: Stop leftover test processes
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*.test' -or $_.ProcessName -like 'pitwall*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      - name: get.sh
        if: runner.os == 'macOS'
        run: sh scripts/get_test.sh
      - name: get.ps1
        if: runner.os == 'Windows'
        # why: the runner's Windows PowerShell 5.1 crashed loading its own assembly.
        shell: pwsh
        run: |
          $env:PITWALL_GET_TEST = '1'
          . ./scripts/get.ps1
          if ((Get-PitwallAsset AMD64) -ne 'pitwall_windows_amd64.zip' -or (Get-PitwallAsset ARM64) -ne 'pitwall_windows_arm64.zip') { exit 1 }
