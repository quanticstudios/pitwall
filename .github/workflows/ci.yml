name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # why: the build the maintainer runs and tests; Gio draws through OpenGL.
  GOFLAGS: -tags=novulkan

jobs:
  # Each shard gets its own runner so no one runs much past four minutes;
  # linux below is the check that main requires.
  linux-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [lint, cmd, daemon-al, daemon-mz, rest, drill]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # why: internal/agent runs the generated pi and OpenCode guards, and fails without node here.
      - if: matrix.shard == 'rest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Gio's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev socat jq
      - name: gofmt
        if: matrix.shard == 'lint'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - if: matrix.shard == 'lint'
        run: go vet ./...
      - name: go vet for Windows
        if: matrix.shard == 'lint'
        run: GOOS=windows go vet ./...
      - name: Link the Windows release binaries with their icon
        if: matrix.shard == 'lint'
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags=-H=windowsgui -o /dev/null ./cmd/pitwall
          GOOS=windows GOARCH=arm64 go build -ldflags=-H=windowsgui -o /dev/null ./cmd/pitwall
      - name: Vet the vendored terminal module
        if: matrix.shard == 'lint'
        run: go -C third_party/x-vt vet ./...
      - name: Scripts
        if: matrix.shard == 'lint'
        run: |
          sh -n scripts/install.sh
          sh -n scripts/get.sh
          sh scripts/get_test.sh
          sh scripts/release_test.sh
          sh scripts/release-check_test.sh
          sh scripts/sandbox_test.sh
          sh -n scripts/core-smoke.sh
          sh scripts/apk_test.sh
          sh scripts/apk-release_test.sh
      - name: Test cmd/pitwall
        if: matrix.shard == 'cmd'
        run: go test -race -timeout 10m -skip '^TestUpdateDrill$' ./cmd/pitwall
      # why: internal/daemon alone was the floor; its tests split by name
      # range so a new test lands in a shard on its own.
      - name: Test daemon A-L
        if: matrix.shard == 'daemon-al'
        run: go test -race -timeout 10m -run '^Test[A-L]' ./internal/daemon
      - name: Test daemon M-Z
        if: matrix.shard == 'daemon-mz'
        run: go test -race -timeout 10m -run '^Test[M-Z]' ./internal/daemon
      - name: Test the rest
        if: matrix.shard == 'rest'
        run: |
          go test -race -timeout 10m $(go list ./... | grep -v -e '/internal/daemon$' -e '/cmd/pitwall$')
          go test -race gioui.org/app
          go -C third_party/x-vt test -race -timeout 5m ./...
      # why: it builds pitwall releases, so it runs once, beside the others.
      - name: Release drill
        if: matrix.shard == 'drill'
        run: go test -race -count=1 -timeout 10m -run '^TestUpdateDrill$' ./cmd/pitwall
      # why: testenv.Main moves HOME, so a test that finds the home some other way shows up here.
      - name: No test wrote pitwall's files under HOME
        if: matrix.shard != 'lint'
        run: |
          for d in .local/state/pitwall .config/pitwall .cache/pitwall; do
            if [ -e "$HOME/$d" ]; then echo "::error::a test wrote ~/$d"; exit 1; fi
          done

  # The check main requires: every linux-test shard passed.
  linux:
    if: always()
    needs: linux-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.linux-test.result }}
        run: test "$RESULT" = success

  # pitwall-core: the daemon and every command but the window. No apt step,
  # so a runtime dependency on a GUI library fails here; every go command,
  # a go build inside a test too, builds the core.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
      GOFLAGS: -tags=nogui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go vet ./cmd/pitwall
      - name: Build a static binary for amd64 and arm64
        run: |
          go build -o "$RUNNER_TEMP/pitwall-core" ./cmd/pitwall
          linked=$(ldd "$RUNNER_TEMP/pitwall-core" 2>&1 || true)
          case "$linked" in
            *'not a dynamic executable'*) ;;
            *) printf 'pitwall-core links:\n%s\n' "$linked"; exit 1 ;;
          esac
          "$RUNNER_TEMP/pitwall-core" --version
          GOARCH=arm64 go build -o /dev/null ./cmd/pitwall
      - name: Smoke test, as the release runs it
        run: sh scripts/core-smoke.sh "$RUNNER_TEMP/pitwall-core"
      - name: Imports
        run: |
          sh scripts/core-imports.sh
          sh scripts/core-imports_test.sh
      - name: List the tests that run
        run: go test -list . ./cmd/pitwall ./internal/update
      - run: go test -count=1 -timeout 15m ./cmd/pitwall ./internal/update

  # The last release's own pitwall update, and this pitwall-core's update,
  # against a daemon of that release, with programs in its panes
  # (TestReleaseHandoff). The release is the first "## v" heading of
  # CHANGELOG.md, so it changes only when a PR rebases onto a newer main.
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # why: the release is a desktop binary, and the test builds this one.
      - name: Install Gio's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev
      - name: Download the last release
        run: |
          # why: on a release PR, and until its tag is pushed, the newest heading has no release yet.
          tags=$(awk '/^## v/ { print $2 }' CHANGELOG.md | head -2)
          mkdir "$RUNNER_TEMP/baseline"
          cd "$RUNNER_TEMP/baseline"
          for tag in $tags; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
            if curl -fsSLO "$url/pitwall_linux_amd64.tar.gz"; then break; fi
          done
          echo "Baseline release: $tag"
          curl -fsSLO "$url/checksums.txt"
          grep ' pitwall_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf pitwall_linux_amd64.tar.gz pitwall
          ./pitwall --version
      - name: TestReleaseHandoff
        env:
          PITWALL_BASELINE: ${{ runner.temp }}/baseline/pitwall
        run: |
          set -o pipefail
          go test -count=1 -v -run '^TestReleaseHandoff$' ./cmd/pitwall | tee "$RUNNER_TEMP/handoff.log"
          # why: the test skips without its baseline; a skip must fail here.
          grep -q -- '^--- PASS: TestReleaseHandoff ' "$RUNNER_TEMP/handoff.log"

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # why: HEAD is the PR merged into its base, so HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Require a CHANGELOG.md entry for cmd/ and internal/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- cmd internal; then
            echo 'No change under cmd/ or internal/.'
            exit 0
          fi
          # why: read live, so adding the label and re-running the job skips it.
          label=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "no-changelog")') || label=false
          if [ "$label" = true ]; then
            echo 'Skipped: the PR has the no-changelog label.'
            exit 0
          fi
          git show HEAD^1:CHANGELOG.md | awk '/^## /{n++} n==1' > base.md
          awk '/^## /{n++} n==1' CHANGELOG.md > head.md
          added=$(grep -vxFf base.md head.md | grep -v '^## ' | grep '[^[:space:]]' || true)
          if [ -n "$added" ]; then
            printf 'New in the top CHANGELOG.md section:\n%s\n' "$added"
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR changes cmd/ or internal/ but adds no line under the top '## Unreleased' section of CHANGELOG.md. Add one, or ask a maintainer for the no-changelog label and re-run this job."
          exit 1

  # macOS shards; other below is the check that main requires.
  macos-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [build, drill, cmd, rest]
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build, vet and test the platform-independent packages
        if: matrix.shard == 'build'
        run: |
          go build ./...
          go vet ./...
          go test gioui.org/app
          go test ./internal/agent ./internal/pane ./internal/model ./internal/layout ./internal/input
          sh scripts/get_test.sh
      - name: Release drill
        if: matrix.shard == 'drill'
        run: go test -count=1 -v -run 'TestUpdateDrill|TestFinishUpdate' ./cmd/pitwall
      # why: the macOS suite has never passed; drop continue-on-error after its first green run.
      - name: Test cmd/pitwall
        if: matrix.shard == 'cmd'
        continue-on-error: true
        run: go test -timeout 5m -skip '^TestUpdateDrill$' ./cmd/pitwall
      - name: Test the rest
        if: matrix.shard == 'rest'
        continue-on-error: true
        run: go test -timeout 5m $(go list ./... | grep -v '/cmd/pitwall$')

  # The check main requires, under its old matrix name.
  other:
    if: always()
    needs: macos-test
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.macos-test.result }}
        run: test "$RESULT" = success

  # Windows' suite ran as one -p=1 lane because Git-heavy packages
  # competing overrun checkpoint and retrieval deadlines. Each shard gets
  # its own runner, so the heavy packages stay serial without competing,
  # and the rest uses the runner's four cores.
  windows-test:
    strategy:
      fail-fast: false
      matrix:
        shard: [daemon-ah, daemon-ip, daemon-qz, gitstat, cmd, rest]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # why: a hung Windows test can hold a file in the build cache, failing the cache save.
          cache: false
      # why: the runner's C: writes at ~120 MB/s and its D: at ~210 MB/s.
      # Only the build cache moves: test temp dirs must stay on C: because
      # tests assume os.TempDir and C: are the same drive (TestCwdFollowsCd
      # sends "cd C:\Windows" without /d).
      - name: Redirect the build cache to the D drive
        run: echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
      # why: internal/daemon alone was the floor; its tests split by name
      # range so a new test lands in a shard on its own.
      - name: Test daemon A-H
        if: matrix.shard == 'daemon-ah'
        run: go test -p=1 -timeout 10m -run 'Test[A-H]' ./internal/daemon
      - name: Test daemon I-P
        if: matrix.shard == 'daemon-ip'
        run: go test -p=1 -timeout 10m -run 'Test[I-P]' ./internal/daemon
      - name: Test daemon Q-Z
        if: matrix.shard == 'daemon-qz'
        run: go test -p=1 -timeout 10m -run 'Test[Q-Z]' ./internal/daemon
      - name: Test gitstat
        if: matrix.shard == 'gitstat'
        run: go test -p=1 -timeout 10m ./internal/gitstat
      - name: Test cmd
        if: matrix.shard == 'cmd'
        run: go test -p=1 -timeout 10m ./cmd/pitwall
      - name: Test the rest, build, vet and get.ps1
        if: matrix.shard == 'rest'
        run: |
          go build ./...
          go vet ./...
          go test gioui.org/app
          go test -timeout 5m $(go list ./... | grep -v -e '/internal/daemon$' -e '/internal/gitstat$' -e '/cmd/pitwall$')
      - name: get.ps1
        if: matrix.shard == 'rest'
        # why: the runner's Windows PowerShell 5.1 crashed loading its own assembly.
        shell: pwsh
        run: |
          $env:PITWALL_GET_TEST = '1'
          . ./scripts/get.ps1
          if ((Get-PitwallAsset AMD64) -ne 'pitwall_windows_amd64.zip' -or (Get-PitwallAsset ARM64) -ne 'pitwall_windows_arm64.zip') { exit 1 }
          $exe = (Get-Command cmd.exe).Source
          $lnk = Join-Path $env:RUNNER_TEMP 'pitwall.lnk'
          New-PitwallShortcut $exe $lnk
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($s.TargetPath -ne $exe -or $s.IconLocation -ne "$exe,0") { "shortcut: $($s.TargetPath) $($s.IconLocation)"; exit 1 }
      - name: Stop leftover test processes
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*.test' -or $_.ProcessName -like 'pitwall*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
